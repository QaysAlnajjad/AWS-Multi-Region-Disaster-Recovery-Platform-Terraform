name: Knowledge Base Sync

on:

  workflow_dispatch:

  push:

    paths:

      - "knowledge-base/**"

permissions:

  contents: read

  id-token: write

jobs:

  sync:

    runs-on: ubuntu-latest

    env:

      AWS_REGION: us-east-1

    steps:

      ##################################################################
      # Checkout
      ##################################################################

      - name: Checkout Repository

        uses: actions/checkout@v5

      ##################################################################
      # AWS Credentials
      ##################################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: arn:aws:iam::127214183643:role/github-actions-terraform-role

          aws-region: ${{ env.AWS_REGION }}

      ##################################################################
      # Load AI Configuration
      ##################################################################

      - name: Load AI Configuration

        run: |

          echo "KNOWLEDGE_BASE_ID=$(aws ssm get-parameter \
            --name /wordpress/ai/knowledge-base/id \
            --query Parameter.Value \
            --output text)" >> $GITHUB_ENV

          echo "DATA_SOURCE_ID=$(aws ssm get-parameter \
            --name /wordpress/ai/data-source/id \
            --query Parameter.Value \
            --output text)" >> $GITHUB_ENV

          echo "KNOWLEDGE_BUCKET=$(aws ssm get-parameter \
            --name /wordpress/ai/knowledge-bucket/name \
            --query Parameter.Value \
            --output text)" >> $GITHUB_ENV

      ##################################################################
      # Upload Knowledge Base
      ##################################################################

      - name: Upload Knowledge Base

        run: |

          aws s3 sync \
            knowledge-base/ \
            s3://${KNOWLEDGE_BUCKET}/ \
            --delete

      ##################################################################
      # Setup Python
      ##################################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      ##################################################################
      # Install Dependencies
      ##################################################################

      - name: Install Dependencies

        run: |

          pip install boto3

      ##################################################################
      # Start Ingestion
      ##################################################################

      - name: Start Ingestion
      
        run: |
      
          JOB_ID=$(
            aws bedrock-agent start-ingestion-job \
              --knowledge-base-id "${KNOWLEDGE_BASE_ID}" \
              --data-source-id "${DATA_SOURCE_ID}" \
              --query "ingestionJob.ingestionJobId" \
              --output text
          )
      
          echo "INGESTION_JOB_ID=${JOB_ID}" >> $GITHUB_ENV

      ##################################################################
      # Wait For Completion
      ##################################################################

      - name: Wait For Completion
      
        run: |
      
          while true
          do
      
            STATUS=$(
              aws bedrock-agent get-ingestion-job \
                --knowledge-base-id "${KNOWLEDGE_BASE_ID}" \
                --data-source-id "${DATA_SOURCE_ID}" \
                --ingestion-job-id "${INGESTION_JOB_ID}" \
                --query "ingestionJob.status" \
                --output text
            )
      
            echo "Status: ${STATUS}"
      
            if [ "${STATUS}" = "COMPLETE" ]; then
              exit 0
            fi
      
            if [ "${STATUS}" = "FAILED" ]; then
              exit 1
            fi
      
            sleep 10
      
          done
