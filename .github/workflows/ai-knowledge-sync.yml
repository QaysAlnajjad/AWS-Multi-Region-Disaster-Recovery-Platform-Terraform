name: Bedrock Knowledge Sync

on:

  workflow_dispatch:

  push:

    paths:

      - "knowledge/**"


permissions:

  id-token: write

  contents: read


jobs:

  knowledge-sync:

    runs-on: ubuntu-latest

    env:

      AWS_REGION: us-east-1

      KNOWLEDGE_BUCKET: ${{ secrets.KNOWLEDGE_BUCKET }}

      KNOWLEDGE_BASE_ID: ${{ secrets.KNOWLEDGE_BASE_ID }}

      DATA_SOURCE_ID: ${{ secrets.DATA_SOURCE_ID }}

    steps:

      ####################################################################
      # Checkout Repository
      ####################################################################

      - name: Checkout

        uses: actions/checkout@v4


      ####################################################################
      # Configure AWS Credentials
      ####################################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      ####################################################################
      # Upload Knowledge Documents
      ####################################################################

      - name: Upload Knowledge Documents

        run: |

          aws s3 sync \
            knowledge/ \
            s3://${KNOWLEDGE_BUCKET}/ \
            --delete


      ####################################################################
      # Start Bedrock Ingestion
      ####################################################################

      - name: Start Bedrock Ingestion

        run: |

          python scripts/ai-review/start_ingestion.py \
            ${KNOWLEDGE_BASE_ID} \
            ${DATA_SOURCE_ID}


      ####################################################################
      # Wait Until Ingestion Finishes
      ####################################################################

      - name: Wait For Ingestion

        run: |

          python scripts/ai-review/wait_ingestion.py
