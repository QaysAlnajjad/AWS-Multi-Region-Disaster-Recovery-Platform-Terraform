name: Bedrock Knowledge Sync

on:

  workflow_dispatch:

  push:

    paths:

      - "knowledge/**"

permissions:

  contents: read

  id-token: write

jobs:

  sync:

    runs-on: ubuntu-latest

    env:

      AWS_REGION: us-east-1

    steps:

      ##################################################################
      # Checkout
      ##################################################################

      - name: Checkout Repository

        uses: actions/checkout@v5

      ##################################################################
      # AWS Credentials
      ##################################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: arn:aws:iam::127214183643:role/github-actions-terraform-role

          aws-region: ${{ env.AWS_REGION }}

      ##################################################################
      # Load AI Configuration
      ##################################################################

      - name: Upload Knowledge

        run: |

          source scripts/common/load-ai-config.sh

          aws s3 sync \
            knowledge/ \
            s3://${KNOWLEDGE_BUCKET}/ \
            --delete

      ##################################################################
      # Setup Python
      ##################################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      ##################################################################
      # Install Dependencies
      ##################################################################

      - name: Install Dependencies

        run: |

          pip install boto3

      ##################################################################
      # Start Ingestion
      ##################################################################

      - name: Start Ingestion

        run: |

          source scripts/common/load-ai-config.sh

          python scripts/ai-review/start_ingestion.py \
            "${KNOWLEDGE_BASE_ID}" \
            "${DATA_SOURCE_ID}"

      ##################################################################
      # Wait For Completion
      ##################################################################

      - name: Wait For Completion

        run: |

          python scripts/ai-review/wait_ingestion.py
