name: Infrastructure AI Review


on:

  workflow_call:

  workflow_dispatch:



permissions:

  contents: read
  id-token: write



jobs:


  review:


    name: Terraform Infrastructure Review

    runs-on: ubuntu-latest



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: arn:aws:iam::127214183643:role/github-actions-terraform-role

          aws-region: us-east-1

          role-duration-seconds: 7200



      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3


      - name: Install Trivy
      
        run: |
      
          sudo apt-get update
      
          sudo apt-get install -y wget gnupg
      
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
      
      
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
          https://aquasecurity.github.io/trivy-repo/deb \
          generic main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list
      
      
          sudo apt-get update
      
          sudo apt-get install -y trivy
      
      
      
      - name: Discover Terraform directories

        id: terraform_dirs

        shell: bash

        run: |

          dirs=$(find ./environments \
          -type f \
          -name "*.tf" \
          -exec dirname {} \; \
          | sort -u)


          echo "Terraform directories found:"

          echo "$dirs"


          echo "dirs<<EOF" >> $GITHUB_OUTPUT

          echo "$dirs" >> $GITHUB_OUTPUT

          echo "EOF" >> $GITHUB_OUTPUT




      - name: Terraform Validation

        shell: bash

        run: |


          while read dir

          do

            echo "================================"

            echo "Checking: $dir"

            echo "================================"


            cd "$dir"


            terraform fmt -recursive


            terraform init \
            -backend=false


            terraform validate -no-color


            cd - > /dev/null


          done <<< "${{ steps.terraform_dirs.outputs.dirs }}"

          
          
      - name: Terraform Plan
          
        shell: bash
          
        run: |
        
            mkdir -p ai-results
        
        
            while read dir
        
            do
        
              echo "=============================="
              echo "Planning: $dir"
              echo "=============================="
        
        
              cd "$dir"
        
        
              terraform init \
              -backend=false
        
        
        
              TFVARS=$(find . -maxdepth 1 -name "*.tfvars" | head -1)
        
        
        
              if [ -n "$TFVARS" ]
        
              then
        
                echo "Using variables file: $TFVARS"
        
        
                terraform plan \
                -out=tfplan \
                -var-file="$TFVARS" \
                -no-color
        
        
              else
        
        
                terraform plan \
                -out=tfplan \
                -no-color
        
        
              fi
        
        
        
              terraform show \
              -json tfplan \
              > "../../ai-results/$(echo $dir | tr '/' '_')-terraform-plan.json"
        
        
        
              cd - > /dev/null
        
        
            done <<< "${{ steps.terraform_dirs.outputs.dirs }}"      - name: Run Trivy Terraform Scan
        
                run: |
              
                  mkdir -p ai-results
              
                  trivy config ./environments \
                    --format json \
                    --output ai-results/trivy-results.json
        
        
  

      - name: Upload Infrastructure Review Results

        uses: actions/upload-artifact@v4

        with:

          name: infrastructure-review-results

          path: ai-results/
