name: Infrastructure AI Review


on:

  workflow_call:

  workflow_dispatch:



permissions:

  contents: read

  id-token: write



jobs:


  review:


    name: Terraform Infrastructure Review

    runs-on: ubuntu-latest



    steps:


      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: arn:aws:iam::127214183643:role/github-actions-terraform-role

          aws-region: us-east-1

          role-duration-seconds: 7200



      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3



      - name: Install tfsec

        run: |

          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash




      - name: Discover Terraform directories

        id: terraform_dirs

        shell: bash

        run: |


          dirs=$(find . \
          -type f \
          -name "*.tf" \
          -not -path "*/.terraform/*" \
          -exec dirname {} \; \
          | sort -u)



          echo "Terraform directories found:"

          echo "$dirs"



          echo "dirs<<EOF" >> $GITHUB_OUTPUT

          echo "$dirs" >> $GITHUB_OUTPUT

          echo "EOF" >> $GITHUB_OUTPUT



          
          - name: Terraform Validation
          
            shell: bash
          
            run: |
          
          
              while read dir
          
              do
          
                echo "================================"
                echo "Checking: $dir"
                echo "================================"
        
          
                cd "$dir"
          
          
                terraform fmt -check -recursive
          
          
                terraform init \
                -backend=false
          
          
                terraform validate -no-color
          
          
                cd - > /dev/null
          
          
              done <<< "${{ steps.terraform_dirs.outputs.dirs }}"
          
                - name: Terraform Plan
          
                  shell: bash
          
                  run: |
          
          
                    mkdir -p ai-results
          
          
          
                    while read dir
          
                    do
          
          
                      name=$(echo "$dir" | tr '/' '_')
          
          
          
                      echo "Planning: $dir"
          
          
          
                      cd "$dir"
          
          
          
                      terraform init
          
          
          
                      terraform plan \
                      -out=tfplan \
                      -no-color
          
          
          
                      terraform show \
                      -json tfplan \
                      > "../ai-results/${name}-terraform-plan.json"
          
          
          
                      cd - > /dev/null
          
          
          
                    done <<< "${{ steps.terraform_dirs.outputs.dirs }}"
          
          
        
        

      - name: Run tfsec Security Scan

        shell: bash

        run: |


          tfsec . \
          --format json \
          --out ai-results/tfsec-results.json





      - name: Upload Infrastructure Review Results

        uses: actions/upload-artifact@v4

        with:

          name: infrastructure-review-results

          path:

            ai-results/
