name: AI Infrastructure Review

on:

  workflow_dispatch:

  workflow_call:

permissions:

  contents: read

  id-token: write

jobs:

  review:

    runs-on: ubuntu-latest

    env:

      AWS_REGION: us-east-1

    steps:

      ##################################################################
      # Checkout Repository
      ##################################################################

      - name: Checkout Repository

        uses: actions/checkout@v5

      ##################################################################
      # Configure AWS Credentials
      ##################################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: arn:aws:iam::127214183643:role/github-actions-terraform-role

          aws-region: ${{ env.AWS_REGION }}

      ##################################################################
      # Setup Python
      ##################################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      ##################################################################
      # Setup Terraform
      ##################################################################

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

      ##################################################################
      # Install Trivy
      ##################################################################

      - name: Install Trivy

        run: |

          sudo apt-get update

          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | sudo gpg --dearmor \
          -o /usr/share/keyrings/trivy.gpg

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update

          sudo apt-get install -y trivy
      
      ##################################################################
      # Setup TFLint
      ##################################################################
      
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
      
      - name: Check TFLint Version
        run: tflint --version       

      ##################################################################
      # Install Checkov
      ##################################################################

      - name: Install Checkov

        run: |

          pip install checkov

      ##################################################################
      # Create Results Directory
      ##################################################################

      - name: Create Results Directory

        run: |

          mkdir -p ai-results

      ##################################################################
      # Terraform Format Check
      ##################################################################

      - name: Terraform Format
        id: fmt
        continue-on-error: true
        run: |
          terraform fmt -check -recursive > ai-results/fmt.txt 2>&1

      ##################################################################
      # Terraform Validate
      ##################################################################

      - name: Terraform Validation
        id: validate
        continue-on-error: true

        run: |

          chmod +x scripts/deployment/terraform-validation.sh

          ./scripts/deployment/terraform-validation.sh > ai-results/validation.txt 2>&1
      
      ##################################################################
      # Run TFLint
      ##################################################################
      
      - name: Run TFLint
        id: tflint
        continue-on-error: true
        run: |
          tflint --recursive > ai-results/tflint.txt 2>&1

      ##################################################################
      # Checkov
      ##################################################################

      - name: Run Checkov
        continue-on-error: true
        run: |
          checkov \
            -d environments \
            -o json \
            > ai-results/checkov.json

      ##################################################################
      # Create Review Input
      ##################################################################

      - name: Create Review Input

        run: |

          python scripts/ai-review/review_create_input.py


      ##################################################################
      # Load AI Configuration
      ##################################################################
      
      - name: Load AI Configuration
      
        run: |
      
          echo "KNOWLEDGE_BASE_ID=$(aws ssm get-parameter \
            --name /wordpress/ai/knowledge-base/id \
            --query 'Parameter.Value' \
            --output text)" >> "$GITHUB_ENV"
      
            
      ##################################################################
      # Bedrock AI Review
      ##################################################################

      - name: Run Bedrock Review

        run: |

          python scripts/ai-review/bedrock_review.py \
            ai-results/review_input.json \
            "${KNOWLEDGE_BASE_ID}"

      ##################################################################
      # Enrich AI Report
      ##################################################################

      - name: Enrich AI Report

        run: |

          python scripts/ai-review/enrich_report.py

      ##################################################################
      # Upload Final Report
      ##################################################################

      - name: Upload AI Report

        uses: actions/upload-artifact@v4

        with:

          name: ai-infrastructure-review-report

          path: ai-results/ai-report.json
